name: Internal Boundary Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-internal-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false
      - name: Block forbidden directories
        run: |
          for p in eval infra scripts/data scripts/remote; do
            if [ -e "$p" ]; then
              echo "forbidden path present: $p"
              exit 1
            fi
          done
      - name: Block internal-sensitive filenames
        run: |
          set -euo pipefail
          bad="$(rg -n --hidden --glob '!.git/**' '(eval-at-scale|bundle-workflow|vaner_report|production-roadmap|release-audit)' . || true)"
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi
      - name: Block private training imports
        run: |
          private_module="$(printf 'vaner_%s' 'train')"
          if rg -n "import\s+${private_module}|from\s+${private_module}" src/; then
            exit 1
          fi
