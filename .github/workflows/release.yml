name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      slsa_subjects: ${{ steps.slsa_subjects.outputs.value }}
    permissions:
      attestations: write
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/cockpit/package-lock.json
      - name: Build
        run: |
          python -m pip install --require-hashes -r requirements/release.txt
          npm --prefix ui/cockpit ci
          npm --prefix ui/cockpit run build
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          python -m build
      - name: Generate SBOM
        run: cyclonedx-py requirements requirements/release.txt --output-format json --output-file sbom.json
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Sign release artifacts with keyless Sigstore
        run: |
          set -euo pipefail
          for f in dist/* sbom.json; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-path: "dist/*"
          sbom-path: "sbom.json"
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: |
            dist/*
            sbom.json
            dist/*.sigstore.json
            sbom.json.sigstore.json
      - name: Generate SLSA subjects
        id: slsa_subjects
        run: |
          set -euo pipefail
          python scripts/release/preflight.py slsa-subjects > /tmp/slsa-subjects.b64
          echo "value=$(cat /tmp/slsa-subjects.b64)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: "dist/*"
      - name: Stage clean PyPI dist (drop Sigstore + intoto + SBOM siblings)
        if: ${{ vars.PYPI_PUBLISH == '1' }}
        run: |
          set -euo pipefail
          # `pypa/gh-action-pypi-publish` runs `twine check` over every file
          # in `packages-dir`; the Sigstore bundle (`*.sigstore.json`) and any
          # SLSA in-toto envelopes that the previous Sign / Attest steps
          # dropped next to the wheel + sdist trip twine with
          # "InvalidDistribution: Unknown distribution format". Stage a
          # filtered dist that contains only the wheel + sdist + their
          # PEP-740 attestations, leaving the rest in `dist/` for the
          # GitHub-release upload below.
          mkdir -p dist-pypi
          shopt -s nullglob
          for f in dist/*.whl dist/*.tar.gz; do
            cp "$f" dist-pypi/
          done
          # Also copy attestations the action expects when `attestations:
          # true` is set — at the time of writing those are produced by
          # `actions/attest-build-provenance` and live alongside the
          # artifacts inside dist/.
          for f in dist/*.publish.attestation; do
            [ -f "$f" ] && cp "$f" dist-pypi/
          done
          ls -la dist-pypi/
      - name: Publish to PyPI
        if: ${{ vars.PYPI_PUBLISH == '1' }}
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist-pypi/
      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VANER_RELEASE_AUTOPUBLISH: ${{ vars.VANER_RELEASE_AUTOPUBLISH || '1' }}
        run: |
          set -euo pipefail
          # Ensure the release exists (tag push normally creates it via release-drafter; be idempotent).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes
          fi
          assets=$(python scripts/release/preflight.py assets)
          # shellcheck disable=SC2086
          gh release upload "$TAG" $assets --clobber
          # 0.8.5 WS11 — auto-publish a drafted release after assets attach.
          # release-drafter creates a draft on every PR merge to main; the
          # draft becomes the tagged release but stays unpublished unless
          # we flip the draft bit here. Prior to this step v0.8.2 and
          # v0.8.3 tags had drafts that never shipped (user surfaced the
          # gap during 0.8.4). Publishing explicitly is idempotent on
          # already-published releases.
          is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          is_prerelease=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
          if [ "$is_prerelease" = "true" ]; then
            echo "Release $TAG is marked prerelease; leaving draft/latest state unchanged"
            exit 0
          fi
          if [ "${VANER_RELEASE_AUTOPUBLISH:-1}" != "1" ]; then
            echo "VANER_RELEASE_AUTOPUBLISH is not 1; leaving draft release $TAG unpublished"
            exit 0
          fi
          if [ "$is_draft" = "true" ]; then
            echo "Publishing draft release $TAG"
            gh release edit "$TAG" --draft=false --latest
          fi

  slsa-provenance:
    needs: publish
    permissions:
      actions: read
      id-token: write
      contents: write
    # slsa-github-generator REQUIRES a tag-form ref here — it verifies its own
    # provenance against the tag at runtime and exits with `Invalid ref: <sha>`
    # when called by SHA. This is the only reusable-workflow uses: line in the
    # repo that intentionally bypasses the SHA-pin policy. See the project's
    # SECURITY.md / RELEASE.md for the rationale.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.publish.outputs.slsa_subjects }}
      upload-assets: true

  verify:
    # Verify after both artifact publication and SLSA upload so the release
    # page contains the provenance file this job validates.
    needs: [publish, slsa-provenance]
    if: ${{ always() && needs.publish.result == 'success' && needs.slsa-provenance.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Install slsa-verifier
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/slsa-framework/slsa-verifier/releases/latest/download/slsa-verifier-linux-amd64 \
            -o /usr/local/bin/slsa-verifier
          chmod +x /usr/local/bin/slsa-verifier
      - name: Download published artifacts + provenance from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 0.8.10 fix: verify the artifacts that users actually pull
          # from the GitHub release (and that PyPI received), not the
          # `python-dist` action artifact. Pre-fix the verify side
          # downloaded `python-dist` and computed sha A; the release
          # had sha B because `slsa-provenance/upload-assets` re-
          # uploaded the wheel from inside the SLSA generator with a
          # different mtime/zip ordering. attest-build-provenance had
          # registered against sha B (the post-upload sha), so the
          # `gh attestation verify` lookup against sha A 404'd.
          # Pulling from the release re-aligns the verify side with
          # what attestations were actually issued for.
          mkdir -p dist-assets/dist
          gh release download "$TAG" --pattern "*.whl" --pattern "*.tar.gz" \
            --pattern "*.sigstore.json" --dir dist-assets/dist --clobber
          # SBOM + its sigstore bundle live at the dist-assets root
          # because the original publish step put them there.
          gh release download "$TAG" --pattern "sbom.json" --pattern "sbom.json.sigstore.json" \
            --dir dist-assets --clobber || true
          mkdir -p provenance
          gh release download "$TAG" --pattern "*.intoto.jsonl" --dir provenance --clobber || true
      - name: Verify artifact signatures and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 0.8.8 fix: the newer ``gh attestation verify`` CLI takes a
          # SINGLE file path, not a glob. v0.8.7's release verify failed
          # with "too many arguments" when the wildcard expanded to
          # wheel + sdist. Loop one artifact at a time.
          provenance_file=""
          if compgen -G "provenance/*.intoto.jsonl" > /dev/null; then
            provenance_file="$(printf '%s\n' provenance/*.intoto.jsonl | head -n 1)"
          fi
          python scripts/release/preflight.py primary-artifacts --dist-dir dist-assets/dist --sbom dist-assets/sbom.json > /tmp/primary-artifacts.txt
          while IFS= read -r artifact; do
            [ -n "$artifact" ] || continue
            if [[ "$artifact" == dist-assets/dist/* ]]; then
              gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
            else
              echo "Skipping GitHub artifact attestation for $artifact; SBOM is verified by Sigstore bundle and SLSA subject."
            fi
            bundle="${artifact}.sigstore.json"
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$artifact"
            if [ -n "$provenance_file" ]; then
              slsa-verifier verify-artifact "$artifact" \
                --provenance-path "$provenance_file" \
                --source-uri "github.com/${GITHUB_REPOSITORY}" \
                --source-tag "${GITHUB_REF_NAME}"
            fi
          done < /tmp/primary-artifacts.txt
