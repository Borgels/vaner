<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vaner Prepared Work</title>
    <!--
      Vaner Prepared Work bundle. Renders the unified prepared-work
      dashboard inside an MCP Apps host iframe. Card actions
      (Inspect / Adopt / Export / Dismiss / Feedback) dispatch the
      matching `vaner.work_products.*` (or `vaner.predictions.adopt`)
      tool through the vendored `@modelcontextprotocol/ext-apps` client
      SDK. The SDK itself is inlined at server import time from
      active_predictions.html (see __EXT_APPS_SDK__ placeholder below).
    -->
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      body {
        margin: 0;
        padding: 16px;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 15px;
        line-height: 1.2;
        margin: 0;
      }
      #meta {
        color: color-mix(in srgb, CanvasText 62%, transparent);
        font-size: 12px;
      }
      #status {
        color: color-mix(in srgb, CanvasText 60%, transparent);
        font-size: 12px;
        margin-bottom: 8px;
        min-height: 1em;
      }
      #cards {
        display: grid;
        gap: 8px;
      }
      .card {
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 8px;
        padding: 10px;
        background: color-mix(in srgb, Canvas 94%, CanvasText 6%);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .title {
        font-size: 13px;
        font-weight: 650;
        margin: 0;
      }
      .badge {
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        padding: 2px 7px;
        font-size: 11px;
        white-space: nowrap;
      }
      .summary {
        color: color-mix(in srgb, CanvasText 72%, transparent);
        font-size: 12px;
        line-height: 1.35;
        margin: 6px 0;
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        color: color-mix(in srgb, CanvasText 60%, transparent);
        font-size: 11px;
      }
      .why {
        color: color-mix(in srgb, CanvasText 64%, transparent);
        font-size: 11px;
        line-height: 1.35;
        margin: 6px 0 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .action {
        border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-radius: 6px;
        background: color-mix(in srgb, Canvas 88%, CanvasText 12%);
        color: CanvasText;
        font: inherit;
        font-size: 11px;
        padding: 4px 7px;
        cursor: pointer;
      }
      .action[disabled] {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .action.acted {
        border-color: color-mix(in srgb, CanvasText 32%, transparent);
        background: color-mix(in srgb, Canvas 78%, CanvasText 22%);
      }
      .empty {
        color: color-mix(in srgb, CanvasText 62%, transparent);
        font-size: 13px;
        padding: 16px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Prepared work</h1>
      <span id="meta">Waiting for Vaner</span>
    </header>
    <div id="status" role="status" aria-live="polite" aria-label="Status"></div>
    <main id="cards" aria-label="Prepared work cards"><div class="empty">No prepared work has been sent to this view yet.</div></main>
    <script type="module">
      // The vendored @modelcontextprotocol/ext-apps SDK is inlined here at
      // import time from active_predictions.html (single source of truth).
      // Re-vendor instructions live in the active_predictions.html banner.
__EXT_APPS_SDK__

      const REFRESH_INTERVAL_MS = 6000;
      const cardsNode = document.getElementById("cards");
      const metaNode = document.getElementById("meta");
      const statusNode = document.getElementById("status");
      let pollTimer = null;
      const lastByCardId = new Map();

      const app = new App({ name: "Vaner Prepared Work", version: "1.0.0" });

      function setStatus(message) {
        statusNode.textContent = message ?? "";
      }

      function safeText(value) {
        return String(value ?? "");
      }

      function readPayload(input) {
        if (!input) return null;
        if (typeof input === "string") {
          try {
            return JSON.parse(input);
          } catch {
            return null;
          }
        }
        if (Array.isArray(input?.prepared_work)) return input;
        if (input.text) return readPayload(input.text);
        if (input.detail) return readPayload(input.detail);
        return null;
      }

      function parseToolResultText(result) {
        try {
          const blocks = Array.isArray(result?.content) ? result.content : [];
          for (const block of blocks) {
            if (block?.type === "text" && typeof block.text === "string") {
              const parsed = readPayload(block.text);
              if (parsed) return parsed;
            }
          }
        } catch {
          /* fall through */
        }
        return null;
      }

      function defaultLabelForKind(kind) {
        switch (kind) {
          case "inspect":
            return "Inspect";
          case "export":
            return "Export";
          case "adopt":
            return "Adopt";
          case "dismiss":
            return "Dismiss";
          case "feedback":
            return "Feedback";
          default:
            return safeText(kind || "Action");
        }
      }

      function defaultToolForAction(card, action) {
        if (action?.tool) return action.tool;
        const sourceType = safeText(card?.source_type);
        switch (safeText(action?.kind)) {
          case "inspect":
            return sourceType === "prediction" ? "vaner.inspect" : "vaner.work_products.inspect";
          case "export":
            return "vaner.work_products.export";
          case "adopt":
            return "vaner.predictions.adopt";
          case "dismiss":
            return "vaner.work_products.dismiss";
          case "feedback":
            return "vaner.work_products.feedback";
          default:
            return null;
        }
      }

      function defaultArgsForAction(card, action) {
        const explicit = (action && typeof action.arguments === "object" && action.arguments) || {};
        const merged = { ...explicit };
        const kind = safeText(action?.kind);
        const sourceId = safeText(card?.source_id);
        const sourceType = safeText(card?.source_type);
        if (!("id" in merged) && sourceId) {
          merged.id = sourceId;
        }
        if (kind === "adopt" && sourceType === "prediction") {
          if (!("source" in merged)) merged.source = "mcp_app";
        }
        return merged;
      }

      function dispatchAction(card, action, button) {
        const tool = defaultToolForAction(card, action);
        if (!tool) {
          setStatus(`No tool wired for action "${safeText(action?.kind)}".`);
          return;
        }
        const args = defaultArgsForAction(card, action);
        const originalLabel = button.textContent;
        button.disabled = true;
        button.textContent = `${originalLabel}…`;
        app
          .callTool(tool, args)
          .then((result) => {
            if (result && result.isError) {
              throw new Error(
                (result.error && result.error.message) || "Tool call failed",
              );
            }
            button.classList.add("acted");
            button.textContent = `${originalLabel} ✓`;
            setStatus(`${defaultLabelForKind(action?.kind)} sent for "${safeText(card?.title)}".`);
            // Refresh shortly after so any state change (dismiss, feedback, adopt)
            // is reflected without the user re-invoking the tool.
            window.setTimeout(refresh, 350);
          })
          .catch((err) => {
            button.disabled = false;
            button.textContent = originalLabel;
            const message = (err && err.message) || String(err);
            setStatus(`Action failed: ${message}`);
          });
      }

      function appendActionButton(card, action, container) {
        if (!action) return;
        const button = document.createElement("button");
        button.className = "action";
        button.type = "button";
        button.dataset.kind = safeText(action.kind);
        const label = safeText(action.label) || defaultLabelForKind(action.kind);
        button.textContent = label;
        button.setAttribute("aria-label", `${label}: ${safeText(card.title)}`);
        if (action.disabled) {
          button.disabled = true;
        }
        button.addEventListener("click", () => dispatchAction(card, action, button));
        container.appendChild(button);
      }

      function render(payload) {
        const cards = Array.isArray(payload?.prepared_work) ? payload.prepared_work : [];
        metaNode.textContent = cards.length
          ? `${cards.length} item${cards.length === 1 ? "" : "s"}`
          : "Nothing ready";
        cardsNode.innerHTML = "";
        if (!cards.length) {
          cardsNode.innerHTML = '<div class="empty">No prepared work is ready.</div>';
          lastByCardId.clear();
          return;
        }
        const seen = new Set();
        for (const card of cards) {
          seen.add(card.id);
          const node = document.createElement("article");
          node.className = "card";
          node.setAttribute("aria-label", safeText(card.title));
          node.innerHTML = `
            <div class="row">
              <h2 class="title"></h2>
              <span class="badge"></span>
            </div>
            <p class="summary"></p>
            <p class="why"></p>
            <div class="facts"></div>
            <div class="actions" aria-label="Prepared work actions"></div>
          `;
          node.querySelector(".title").textContent = safeText(card.title);
          node.querySelector(".badge").textContent = safeText(card.badge || card.kind);
          node.querySelector(".summary").textContent = safeText(card.summary);
          node.querySelector(".why").textContent = safeText(card.why_prepared || card.action_note);
          node.querySelector(".facts").textContent = [
            card.confidence_label,
            card.freshness_label,
            card.target_label,
            card.evidence_count ? `${card.evidence_count} sources` : "",
          ]
            .filter(Boolean)
            .join(" · ");
          const actionsNode = node.querySelector(".actions");
          if (card.primary_action) {
            appendActionButton(card, card.primary_action, actionsNode);
          }
          if (Array.isArray(card.secondary_actions)) {
            for (const action of card.secondary_actions) {
              appendActionButton(card, action, actionsNode);
            }
          }
          cardsNode.appendChild(node);
          lastByCardId.set(card.id, card);
        }
        for (const cached of [...lastByCardId.keys()]) {
          if (!seen.has(cached)) lastByCardId.delete(cached);
        }
      }

      async function refresh() {
        try {
          const result = await app.callTool("vaner.prepared_work.dashboard", {});
          const parsed = parseToolResultText(result);
          if (parsed) {
            render(parsed);
            if (Array.isArray(parsed.prepared_work) && parsed.prepared_work.length === 0) {
              setStatus("No prepared work yet — Vaner is still warming up.");
            } else {
              setStatus("");
            }
          }
        } catch (err) {
          const message = (err && err.message) || "unknown error";
          setStatus(`Refresh failed: ${message}`);
        }
      }

      function startPolling() {
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(refresh, REFRESH_INTERVAL_MS);
      }

      app.ontoolresult = ({ content }) => {
        if (!Array.isArray(content) || content.length === 0) return;
        for (const block of content) {
          if (block?.type === "text" && typeof block.text === "string") {
            const parsed = readPayload(block.text);
            if (parsed) {
              render(parsed);
              return;
            }
          }
        }
      };

      // Backward-compat: the previous bundle accepted raw payloads via a
      // window message listener. Hosts that still pre-seed the iframe with
      // window.postMessage(payload) will keep working until they migrate to
      // the standard MCP Apps tool-result channel.
      window.addEventListener("message", (event) => {
        const parsed = readPayload(event.data);
        if (parsed) render(parsed);
      });

      (async () => {
        try {
          await app.connect();
          setStatus("Connected. Loading prepared work…");
          await refresh();
          startPolling();
        } catch (err) {
          const message = (err && err.message) || String(err);
          setStatus(`Could not connect to the host: ${message}`);
        }
      })();
    </script>
  </body>
</html>
