<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vaner Prepared Work</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      body {
        margin: 0;
        padding: 16px;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 15px;
        line-height: 1.2;
        margin: 0;
      }
      #meta {
        color: color-mix(in srgb, CanvasText 62%, transparent);
        font-size: 12px;
      }
      #cards {
        display: grid;
        gap: 8px;
      }
      .card {
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 8px;
        padding: 10px;
        background: color-mix(in srgb, Canvas 94%, CanvasText 6%);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .title {
        font-size: 13px;
        font-weight: 650;
        margin: 0;
      }
      .badge {
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        padding: 2px 7px;
        font-size: 11px;
        white-space: nowrap;
      }
      .summary {
        color: color-mix(in srgb, CanvasText 72%, transparent);
        font-size: 12px;
        line-height: 1.35;
        margin: 6px 0;
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        color: color-mix(in srgb, CanvasText 60%, transparent);
        font-size: 11px;
      }
      .why {
        color: color-mix(in srgb, CanvasText 64%, transparent);
        font-size: 11px;
        line-height: 1.35;
        margin: 6px 0 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .action {
        border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-radius: 6px;
        background: color-mix(in srgb, Canvas 88%, CanvasText 12%);
        color: CanvasText;
        font: inherit;
        font-size: 11px;
        padding: 4px 7px;
      }
      .empty {
        color: color-mix(in srgb, CanvasText 62%, transparent);
        font-size: 13px;
        padding: 16px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Prepared work</h1>
      <span id="meta">Waiting for Vaner</span>
    </header>
    <main id="cards"><div class="empty">No prepared work has been sent to this view yet.</div></main>
    <script>
      const cardsNode = document.getElementById("cards");
      const metaNode = document.getElementById("meta");

      function safeText(value) {
        return String(value ?? "");
      }

      function readPayload(input) {
        if (!input) return null;
        if (input.prepared_work) return input;
        if (typeof input === "string") {
          try {
            return JSON.parse(input);
          } catch {
            return null;
          }
        }
        if (input.text) return readPayload(input.text);
        if (input.detail) return readPayload(input.detail);
        return null;
      }

      function render(payload) {
        const cards = Array.isArray(payload?.prepared_work) ? payload.prepared_work : [];
        metaNode.textContent = cards.length ? `${cards.length} item${cards.length === 1 ? "" : "s"}` : "Nothing ready";
        cardsNode.innerHTML = "";
        if (!cards.length) {
          cardsNode.innerHTML = '<div class="empty">No prepared work is ready.</div>';
          return;
        }
        for (const card of cards) {
          const node = document.createElement("article");
          node.className = "card";
          node.innerHTML = `
            <div class="row">
              <h2 class="title"></h2>
              <span class="badge"></span>
            </div>
            <p class="summary"></p>
            <p class="why"></p>
            <div class="facts"></div>
            <div class="actions" aria-label="Prepared work actions"></div>
          `;
          node.querySelector(".title").textContent = safeText(card.title);
          node.querySelector(".badge").textContent = safeText(card.badge || card.kind);
          node.querySelector(".summary").textContent = safeText(card.summary);
          node.querySelector(".why").textContent = safeText(card.why_prepared || card.action_note);
          node.querySelector(".facts").textContent = [
            card.confidence_label,
            card.freshness_label,
            card.target_label,
            card.evidence_count ? `${card.evidence_count} sources` : "",
          ]
            .filter(Boolean)
            .join(" · ");
          const actions = [card.primary_action, ...(Array.isArray(card.secondary_actions) ? card.secondary_actions : [])].filter(Boolean);
          const actionsNode = node.querySelector(".actions");
          for (const action of actions) {
            const button = document.createElement("button");
            button.className = "action";
            button.type = "button";
            button.dataset.kind = safeText(action.kind);
            button.textContent = safeText(action.label || action.kind);
            button.setAttribute("aria-label", `${button.textContent}: ${safeText(card.title)}`);
            actionsNode.appendChild(button);
          }
          cardsNode.appendChild(node);
        }
      }

      window.addEventListener("message", (event) => {
        const payload = readPayload(event.data);
        if (payload) render(payload);
      });
    </script>
  </body>
</html>
